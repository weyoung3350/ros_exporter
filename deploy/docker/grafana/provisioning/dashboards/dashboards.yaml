# Dashboard provisioning：自动加载 /var/lib/grafana/dashboards 下所有 JSON
apiVersion: 1

providers:
  - name: 'B2 Robot Dashboards'
    orgId: 1
    folder: 'B2'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
